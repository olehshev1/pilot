name: Rails CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      ruby-version: ${{ steps.ruby-version.outputs.ruby-version }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Get Ruby version
        id: ruby-version
        run: echo "ruby-version=3.3.6" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ needs.setup.outputs.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.setup.outputs.ruby-version }}
          bundler-cache: true

      - name: Run Rubocop
        run: bundle exec rubocop --parallel

  fasterer:
    name: Fasterer
    needs: setup
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ needs.setup.outputs.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.setup.outputs.ruby-version }}
          bundler-cache: true

      - name: Run Fasterer
        run: bundle exec fasterer

  security:
    name: Security Checks
    needs: setup
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ needs.setup.outputs.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.setup.outputs.ruby-version }}
          bundler-cache: true

      - name: Run Security Checks
        run: |
          bundle exec bundler-audit --update
          bundle exec brakeman -q -w2

  test:
    name: RSpec
    needs: setup
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service for caching and session tests
      # Comment out this block if you need to run tests without Redis
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        options: >-
          --health-cmd "curl http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ needs.setup.outputs.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.setup.outputs.ruby-version }}
          bundler-cache: true

      - name: Check Redis connection
        run: redis-cli -h localhost ping
        continue-on-error: true

      - name: Check Elasticsearch connection
        run: curl http://localhost:9200/_cluster/health
        continue-on-error: true

      - name: Install PostgreSQL Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Set Up Database
        run: |
          cp config/database.github-actions.yml config/database.yml
          bundle exec rake db:create
          bundle exec rake db:migrate
          bundle exec rake db:schema:load
          bundle exec rake db:seed
        env:
          RAILS_ENV: test
          # Comment out this line if you need to run tests without Redis
          REDIS_URL: redis://localhost:6379/0
          ELASTICSEARCH_URL: http://localhost:9200
          ELASTICSEARCH_HOST: localhost

      - name: Run RSpec
        run: bundle exec rspec
        env:
          RAILS_ENV: test
          # Comment out this line if you need to run tests without Redis
          REDIS_URL: redis://localhost:6379/0
          ELASTICSEARCH_URL: http://localhost:9200
          ELASTICSEARCH_HOST: localhost

      # Optional step to save test coverage report
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
